[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; This physical unit's real flash is 2MB (the "Sense" variant), not the 8MB the
; stock board file assumes -- confirmed the hard way during MicroFi's field
; validation (efm-xiao-microfi.md, 2026-07-29: "Flash memory size mismatch
; detected. Expected 4MB, found 2MB!"). bare_minimum_2MB.csv is the bundled
; no-OTA single-app table sized for a real 2MB chip.
board_upload.flash_size = 2MB
board_build.flash_size = 2MB
board_build.partitions = bare_minimum_2MB.csv

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    https://github.com/mkeras/BasicTag.git
    https://github.com/mkeras/EmbeddedSparkplugNode.git
